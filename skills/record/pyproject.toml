[project]
name = "skill-record"
version = "0.1.0"
description = "Commit research records with provenance and reproduce them"
requires-python = ">=3.11"
dependencies = ["skill-artifact", "skill-pair"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/record"]
