[project]
name = "skill-artifact"
version = "0.1.0"
description = "Content-addressed artifact store for research results"
requires-python = ">=3.11"
dependencies = ["pandas", "pyarrow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifact"]
